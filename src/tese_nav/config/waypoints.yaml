# Rota de inspeção (ronda) — estações a alguns metros dos equipamentos, NÃO em
# cima das anomalias. O robô passa dentro do alcance sensorial (5 m) e o Stay
# Alert fecha a distância (atração) ou recua (repulsão). Frame map = mundo.
#
# Eventos no mundo (anomaly_simulator):
#   atração: transformador (10,10) térmica, barramento (0,15) térmica,
#            disjuntor (-5,5) acústica
#   perigo : (16,0) — ao lado do trecho transit_sul -> est_transformador
waypoints:
  - name: "transit_sul"
    x: 13.0
    y: -8.0
    yaw: 1.57
  - name: "est_transformador"     # ~3 m do transformador (10,10)
    x: 13.0
    y: 10.0
    yaw: 3.14
  - name: "est_barramento"        # ~4 m do barramento (0,15)
    x: 0.0
    y: 11.0
    yaw: 1.57
  - name: "est_disjuntor"         # ~3 m do disjuntor (-5,5)
    x: -8.0
    y: 5.0
    yaw: 0.0
  - name: "retorno"
    x: -10.0
    y: -10.0
    yaw: -1.57
